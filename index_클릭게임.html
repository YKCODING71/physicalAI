<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>보라 도형 클릭 게임</title>
  <style>
    :root { color-scheme: light; --purple:#7654d6; --deep:#34245e; --lavender:#f1edff; --ink:#29253a; --muted:#777285; --page-bg:linear-gradient(145deg,#fbfaff,#f0ebff); --target-start:#a88bf5; --target-end:#6842cf; --arena-bg:radial-gradient(ellipse at 50% 0%,#fff 0,#faf8ff 70%); --arena-border:#e6defa; }
    body[data-theme="mint"] { --purple:#258b70; --deep:#174d40; --lavender:#e7f7f1; --page-bg:linear-gradient(145deg,#f8fffc,#e8f7f1); --target-start:#58c7a4; --target-end:#21866b; --arena-bg:radial-gradient(ellipse at 50% 0%,#fff 0,#f2fcf8 70%); --arena-border:#d2eee3; }
    body[data-theme="sunset"] { --purple:#d9684f; --deep:#653328; --lavender:#fff0e9; --page-bg:linear-gradient(145deg,#fffaf7,#ffede4); --target-start:#ffad72; --target-end:#dd594f; --arena-bg:radial-gradient(ellipse at 50% 0%,#fff 0,#fff7f2 70%); --arena-border:#f5dfd4; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--page-bg); color:var(--ink); font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif; }
    .game { width:min(760px,100%); padding:clamp(22px,5vw,42px); border:1px solid #e7e0fb; border-radius:28px; background:#fff; box-shadow:0 18px 60px #47317b18; }
    .eyebrow { margin:0 0 8px; color:var(--purple); font-size:.78rem; font-weight:800; letter-spacing:.12em; }
    .feature-list { margin:0 0 22px; padding:14px 16px; border:1px solid #e7e0fb; border-radius:16px; background:#faf8ff; }
    .feature-list h2 { margin:0 0 8px; color:var(--deep); font-size:.9rem; }
    .feature-list ul { display:flex; flex-wrap:wrap; gap:7px; margin:0; padding:0; list-style:none; }
    .feature-list li { padding:6px 10px; border-radius:999px; background:#eee8ff; color:#5737ad; font-size:.8rem; font-weight:650; }
    h1 { margin:0; color:var(--deep); font-size:clamp(1.8rem,5vw,2.6rem); }
    .intro { margin:10px 0 24px; color:var(--muted); }
    .stats { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px; }
    .stat { flex:1 1 110px; padding:12px 14px; border-radius:16px; background:var(--lavender); }
    .difficulty { flex:1 1 140px; display:flex; flex-direction:column; justify-content:center; gap:5px; padding:10px 14px; border-radius:16px; background:#f4f0ff; color:var(--muted); font-size:.8rem; }
    .difficulty select { width:100%; border:0; background:transparent; color:var(--deep); font:inherit; font-weight:750; font-size:1rem; outline-color:var(--purple); }
    .stat span { display:block; color:var(--muted); font-size:.8rem; }
    .stat strong { color:var(--deep); font-size:1.45rem; }
    .arena { position:relative; height:310px; overflow:hidden; border:2px solid #e6defa; border-radius:20px; background:var(--arena-bg); border-color:var(--arena-border); }
    #target { position:absolute; left:50%; top:50%; width:70px; height:70px; transform:translate(-50%,-50%); border:0; border-radius:50%; background:linear-gradient(145deg,var(--target-start),var(--target-end)); box-shadow:0 9px 22px #7654d655,inset 0 3px 7px #ffffff80; cursor:pointer; transition:left .18s ease,top .18s ease,transform .12s ease; }
    #target:hover { transform:translate(-50%,-50%) scale(1.08); }
    #target.hit { animation:hit-pop .24s ease-out; }
    @keyframes hit-pop { 50% { filter:brightness(1.35); box-shadow:0 0 0 12px #ffffff88,0 9px 24px #7654d655; } }
    .score-pop { animation:score-pop .22s ease-out; }
    @keyframes score-pop { 50% { transform:scale(1.28); color:var(--purple); } }
    #target:active { transform:translate(-50%,-50%) scale(.92); }
    #target:disabled { cursor:default; filter:grayscale(.3); opacity:.6; }
    .game-over { position:absolute; inset:0; z-index:2; display:grid; place-items:center; padding:20px; background:#34245e99; backdrop-filter:blur(5px); }
    .game-over[hidden] { display:none; }
    .result-card { width:min(300px,100%); padding:24px; border-radius:20px; background:#fff; text-align:center; box-shadow:0 16px 48px #20133e55; }
    .result-card h2 { margin:0 0 8px; color:var(--deep); font-size:1.5rem; }
    .result-card p { margin:0 0 18px; color:var(--muted); }
    #final-score { color:var(--purple); font-size:1.8rem; font-weight:800; }
    #restart { padding:11px 18px; border:0; border-radius:12px; background:var(--purple); color:white; font:inherit; font-weight:750; cursor:pointer; }
    .controls { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:18px; }
    #message { margin:0; color:var(--muted); font-size:.95rem; }
    #start { min-width:130px; padding:13px 22px; border:0; border-radius:14px; background:var(--purple); color:white; font:inherit; font-weight:750; cursor:pointer; box-shadow:0 7px 16px #7654d633; }
    #start:hover { background:#6240c3; }
    #start:focus-visible,#target:focus-visible { outline:3px solid #f2b94b; outline-offset:3px; }
    @media(max-width:480px) { body{padding:12px}.game{padding:22px 16px}.arena{height:280px}.controls{align-items:stretch;flex-direction:column-reverse}#start{width:100%} }
  </style>
</head>
<body>
  <main class="game">
    <p class="eyebrow">VIBE CODING · 만들며 배우기</p>
    <section class="feature-list" aria-labelledby="feature-title">
      <h2 id="feature-title">지금까지 추가된 기능</h2>
      <ul>
        <li>1단계 · 클릭하면 점수 획득</li>
        <li>2단계 · 20초 제한 시간과 종료 화면</li>
        <li>3단계 · 도형이 계속 이동</li>
        <li>4단계 · 난이도 선택과 최고 점수 저장</li>
        <li>5단계 · 색상 테마와 클릭 효과 꾸미기</li>
      </ul>
    </section>
    <h1>보라 도형을 눌러봐!</h1>
    <p class="intro">20초 동안 나타나는 도형을 클릭해 점수를 얻어 보세요.</p>

    <section class="stats" aria-label="게임 기록">
      <div class="stat"><span>점수</span><strong id="score">0</strong></div>
      <div class="stat"><span>남은 시간</span><strong><span id="time" style="display:inline;color:inherit;font-size:inherit">20</span>초</strong></div>
      <div class="stat"><span>최고 점수</span><strong id="best-score">0</strong></div>
      <label class="difficulty" for="difficulty">난이도
        <select id="difficulty">
          <option value="easy">쉬움</option>
          <option value="normal" selected>보통</option>
          <option value="hard">어려움</option>
        </select>
      </label>
      <label class="difficulty" for="theme">테마
        <select id="theme">
          <option value="violet">라벤더</option>
          <option value="mint">민트</option>
          <option value="sunset">선셋</option>
        </select>
      </label>
    </section>

    <div class="arena" id="arena" aria-label="게임 영역">
      <button id="target" type="button" aria-label="점수 도형" disabled></button>
      <section class="game-over" id="game-over" aria-labelledby="result-title" aria-live="polite" hidden>
        <div class="result-card">
          <h2 id="result-title">게임 종료!</h2>
          <p>이번 점수는 <strong id="final-score">0점</strong>이에요.</p>
          <button id="restart" type="button">다시 하기</button>
        </div>
      </section>
    </div>

    <div class="controls">
      <p id="message" aria-live="polite">시작 버튼을 누르면 게임이 시작돼요.</p>
      <button id="start" type="button">게임 시작</button>
    </div>
  </main>

  <script>
    const arena = document.querySelector('#arena');
    const target = document.querySelector('#target');
    const scoreText = document.querySelector('#score');
    const timeText = document.querySelector('#time');
    const message = document.querySelector('#message');
    const startButton = document.querySelector('#start');
    const gameOver = document.querySelector('#game-over');
    const finalScore = document.querySelector('#final-score');
    const restartButton = document.querySelector('#restart');
    const bestScoreText = document.querySelector('#best-score');
    const difficultySelect = document.querySelector('#difficulty');
    const themeSelect = document.querySelector('#theme');

    let score = 0;
    let bestScore = Number(localStorage.getItem('vibeClickBest') || 0);
    bestScoreText.textContent = bestScore;
    let secondsLeft = 20;
    let timerId = null;
    let moveId = null;
    let playing = false;

    function moveTarget() {
      const margin = 42;
      const x = margin + Math.random() * (arena.clientWidth - margin * 2);
      const y = margin + Math.random() * (arena.clientHeight - margin * 2);
      target.style.left = `${x}px`;
      target.style.top = `${y}px`;
    }

    function endGame() {
      playing = false;
      clearInterval(timerId);
      clearInterval(moveId);
      target.disabled = true;
      difficultySelect.disabled = false;
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('vibeClickBest', bestScore);
        bestScoreText.textContent = bestScore;
      }
      startButton.disabled = false;
      startButton.textContent = '다시 하기';
      message.textContent = '결과를 확인하고 다시 도전해 보세요.';
      finalScore.textContent = `${score}점`;
      gameOver.hidden = false;
      restartButton.focus();
    }

    function startGame() {
      score = 0;
      secondsLeft = 20;
      playing = true;
      gameOver.hidden = true;
      const settings = {
        easy: { moveDelay: 1200, targetSize: 76 },
        normal: { moveDelay: 850, targetSize: 68 },
        hard: { moveDelay: 520, targetSize: 56 }
      }[difficultySelect.value];
      target.style.width = `${settings.targetSize}px`;
      target.style.height = `${settings.targetSize}px`;
      difficultySelect.disabled = true;
      scoreText.textContent = score;
      timeText.textContent = secondsLeft;
      message.textContent = '도형을 클릭해 점수를 올려 보세요!';
      target.disabled = false;
      startButton.disabled = true;
      moveTarget();
      clearInterval(moveId);
      moveId = setInterval(moveTarget, settings.moveDelay);
      timerId = setInterval(() => {
        secondsLeft -= 1;
        timeText.textContent = secondsLeft;
        if (secondsLeft <= 0) endGame();
      }, 1000);
    }

    target.addEventListener('click', () => {
      if (!playing) return;
      score += 1;
      scoreText.textContent = score;
      scoreText.classList.remove('score-pop');
      target.classList.remove('hit');
      void scoreText.offsetWidth;
      scoreText.classList.add('score-pop');
      target.classList.add('hit');
      moveTarget();
    });

    themeSelect.addEventListener('change', () => {
      document.body.dataset.theme = themeSelect.value;
    });

    startButton.addEventListener('click', startGame);
    restartButton.addEventListener('click', startGame);
  </script>
</body>
</html>
