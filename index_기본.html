<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>티처블 머신 이미지 인식</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@0.6.1/dist/ml5.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px 40px;
      background: linear-gradient(145deg, #fbfaff, #f0ebff);
      color: #29253a;
      font-family: Arial, "Malgun Gothic", sans-serif;
    }
    main {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: clamp(20px, 5vw, 38px);
      border: 1px solid #e7e0fb;
      border-radius: 26px;
      background: #fff;
      box-shadow: 0 18px 55px #47317b18;
    }
    .eyebrow { margin: 0 0 8px; color: #7654d6; font-size: 12px; font-weight: 800; letter-spacing: .12em; }
    h1 { margin: 0; color: #34245e; font-size: clamp(25px, 5vw, 34px); }
    .intro { margin: 9px 0 22px; color: #777285; }
    .url-label { display: block; margin: 0 0 8px; color: #34245e; font-size: 14px; font-weight: 750; }
    .url-row { display: flex; gap: 9px; }
    #model-url {
      flex: 1; min-width: 0; height: 46px; padding: 0 13px;
      border: 1px solid #dcd5ef; border-radius: 12px; color: #29253a;
      font: inherit; font-size: 14px; outline-color: #7654d6;
    }
    .buttons { display: flex; gap: 9px; margin-top: 11px; }
    button { min-height: 44px; padding: 0 18px; border: 0; border-radius: 12px; color: white; font: inherit; font-weight: 750; cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 3px solid #c6b5ff; outline-offset: 2px; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    #start-button { background: #7654d6; }
    #start-button:hover:not(:disabled) { background: #6240c3; }
    #stop-button { background: #d65f68; }
    #stop-button:hover:not(:disabled) { background: #b84550; }
    #status { min-height: 22px; margin: 14px 0 12px; color: #706c80; font-size: 14px; }
    #canvas-holder { display: flex; justify-content: center; overflow: hidden; border-radius: 18px; }
    canvas { display: block; max-width: 100%; height: auto !important; border: 1px solid #e7e0fb; border-radius: 18px; }
    .help { margin: 12px 0 0; color: #898597; font-size: 12px; line-height: 1.55; }
    @media (max-width: 540px) {
      body { padding: 14px 10px 24px; }
      main { padding: 21px 15px; border-radius: 20px; }
      .url-row { flex-direction: column; }
      #model-url { width: 100%; }
      .buttons button { flex: 1; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">TEACHABLE MACHINE · IMAGE CLASSIFIER</p>
    <h1>이미지 인식 체험</h1>
    <p class="intro">티처블 머신 모델 URL을 입력하고 카메라로 학습한 물체를 비춰 보세요.</p>

    <label class="url-label" for="model-url">티처블 머신 모델 URL</label>
    <div class="url-row">
      <input
        id="model-url"
        type="url"
        value=" "
        placeholder="https://teachablemachine.withgoogle.com/models/모델ID/"
        autocomplete="url"
      >
    </div>
    <div class="buttons">
      <button id="start-button" type="button">인식 시작</button>
      <button id="stop-button" type="button" disabled>인식 종료</button>
    </div>
    <p id="status" role="status" aria-live="polite">모델 URL을 확인하고 인식 시작을 누르세요.</p>
    <div id="canvas-holder"></div>
    <p class="help">카메라 권한을 허용해 주세요. 모델 URL은 티처블 머신의 공유 링크를 붙여 넣으면 됩니다. 모델은 id1, id2, id3 라벨을 스마트폰, 리모컨, 대기로 표시합니다.</p>
  </main>

  <script>
    let classifier = null;
    let video = null;
    let label = "시작 버튼을 눌러 주세요";
    let confidence = 0;
    let isRunning = false;
    let cameraReady = false;
    let modelReady = false;
    let classifying = false;
    let sessionId = 0;

    const startButton = document.querySelector("#start-button");
    const stopButton = document.querySelector("#stop-button");
    const modelUrlInput = document.querySelector("#model-url");
    const statusText = document.querySelector("#status");

    function setup() {
      const canvas = createCanvas(640, 520);
      canvas.parent("canvas-holder");
      textFont("Arial");
    }

    function draw() {
      background("#f8f7fc");

      // Camera preview panel
      noStroke();
      fill("#eeeaf7");
      rect(20, 20, 600, 340, 18);

      if (isRunning && cameraReady && video && video.elt.readyState >= 2) {
        const flippedVideo = ml5.flipImage(video);
        image(flippedVideo, 30, 30, 580, 320);
        flippedVideo.remove();
      } else {
        fill("#706c80");
        textAlign(CENTER, CENTER);
        textSize(18);
        text(isRunning ? "카메라 연결 중..." : "여기에 카메라 화면이 표시됩니다", width / 2, 190);
      }

      // Recognition result panel
      fill("#ffffff");
      stroke("#e7e0fb");
      strokeWeight(1);
      rect(20, 375, 600, 125, 18);
      noStroke();
      fill(getLabelColor(label));
      textAlign(LEFT, CENTER);
      textStyle(BOLD);
      textSize(39);
      text("인식 결과: " + getKoreanLabel(label), 40, 423);
      fill("#706c80");
      textStyle(NORMAL);
      textSize(18);
      text("정확도: " + nf(confidence * 100, 0, 1) + "%", 42, 470);
    }

    function normalizeModelUrl(rawUrl) {
      let cleanUrl = rawUrl.trim();
      if (!cleanUrl) throw new Error("티처블 머신 모델 URL을 입력해 주세요.");
      if (!/^https:\/\//i.test(cleanUrl)) {
        throw new Error("URL은 https:// 로 시작해야 합니다.");
      }
      cleanUrl = cleanUrl.replace(/\s/g, "");
      if (cleanUrl.endsWith("model.json")) return cleanUrl;
      return cleanUrl.replace(/\/+$/, "") + "/model.json";
    }

    function startRecognition() {
      if (isRunning) return;

      let modelJsonUrl;
      try {
        modelJsonUrl = normalizeModelUrl(modelUrlInput.value);
      } catch (error) {
        statusText.textContent = error.message;
        return;
      }

      isRunning = true;
      const thisSession = ++sessionId;
      cameraReady = false;
      modelReady = false;
      classifying = false;
      label = "모델 로딩 중...";
      confidence = 0;
      startButton.disabled = true;
      stopButton.disabled = false;
      modelUrlInput.disabled = true;
      statusText.textContent = "모델을 불러오고 카메라에 연결하는 중입니다...";

      // Load the user-provided Teachable Machine model.
      classifier = ml5.imageClassifier(modelJsonUrl, () => {
        if (!isRunning || thisSession !== sessionId) return;
        modelReady = true;
        startClassificationWhenReady(thisSession);
      });

      // Ask for camera permission only after the user presses Start.
      video = createCapture(VIDEO, () => {
        if (!isRunning || thisSession !== sessionId) return;
        video.size(640, 480);
        video.hide();
        cameraReady = true;
        startClassificationWhenReady(thisSession);
      });
      video.size(640, 480);
      video.hide();
    }

    function startClassificationWhenReady(thisSession) {
      if (!isRunning || thisSession !== sessionId || !modelReady || !cameraReady || classifying) return;
      classifying = true;
      statusText.textContent = "인식 중입니다. 학습한 물체를 카메라에 비춰 보세요.";
      classifyVideo(thisSession);
    }

    function classifyVideo(thisSession) {
      if (!isRunning || thisSession !== sessionId || !classifier || !video) return;

      classifier.classify(video, (error, results) => {
        if (!isRunning || thisSession !== sessionId) return;

        if (error) {
          console.error("분류 오류:", error);
          statusText.textContent = "인식 오류가 발생했습니다. URL과 모델 공개 설정을 확인해 주세요.";
          classifying = false;
          return;
        }

        if (results && results.length > 0) {
          label = results[0].label;
          confidence = results[0].confidence;
        }

        classifyVideo(thisSession);
      });
    }

    function stopRecognition() {
      isRunning = false;
      sessionId += 1;
      classifying = false;
      cameraReady = false;
      modelReady = false;

      if (video) {
        const stream = video.elt && video.elt.srcObject;
        if (stream) stream.getTracks().forEach(track => track.stop());
        video.remove();
        video = null;
      }

      classifier = null;
      label = "인식이 종료되었습니다";
      confidence = 0;
      startButton.disabled = false;
      stopButton.disabled = true;
      modelUrlInput.disabled = false;
      statusText.textContent = "인식이 종료되었습니다. URL을 바꾸거나 다시 시작할 수 있습니다.";
    }

    function getKoreanLabel(currentLabel) {
      if (currentLabel === "id1") return "스마트폰";
      if (currentLabel === "id2") return "리모컨";
      if (currentLabel === "id3") return "대기";
      return currentLabel;
    }

    function getLabelColor(currentLabel) {
      if (currentLabel === "id1") return color("#7654d6");
      if (currentLabel === "id2") return color("#d65f68");
      if (currentLabel === "id3") return color("#258b70");
      return color("#34245e");
    }

    startButton.addEventListener("click", startRecognition);
    stopButton.addEventListener("click", stopRecognition);
  </script>
</body>
</html>
